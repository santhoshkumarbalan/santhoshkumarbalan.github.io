<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passcode Protected Content</title>
    <style>
        /* Basic CSS for the entry form */
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #content-area {
            display: none; /* Hide the secret content initially */
            padding: 20px;
            border: 2px solid #ccc;
            margin: 20px auto;
            max-width: 600px;
            background-color: #f9f9f9;
        }
        #passcode-form {
            padding: 20px;
            border: 1px solid #ddd;
            display: block;
            margin: 20px auto;
            max-width: 400px;
            background-color: #fff;
        }
        input[type="password"], button {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }
        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="passcode-form">
        <h2>Enter Passcode to View</h2>
        <input type="password" id="passcode-input" placeholder="Enter Passcode">
        <button onclick="checkPasscode()">Unlock Content</button>
        <p id="error-message" style="color: red; display: none;">Incorrect Passcode. Try again.</p>
    </div>

    <div id="content-area">
        <h1>Welcome to the Secret Page!</h1>
        <p>This is the special, protected content that is only visible after the correct passcode is entered.</p>
        
        <img src="https://via.placeholder.com/300x150?text=SECRET+IMAGE" alt="Secret content visual">
        <p>The latest update is: **Project X is launching soon!**</p>
    </div>

    <script>
        function checkPasscode() {
            // --- CRUCIAL: Set your desired password here ---
            const CORRECT_PASSCODE = "secret123"; 
            // ---------------------------------------------
            
            const enteredPasscode = document.getElementById("passcode-input").value;
            const contentDiv = document.getElementById("content-area");
            const formDiv = document.getElementById("passcode-form");
            const errorMsg = document.getElementById("error-message");

            if (enteredPasscode === CORRECT_PASSCODE) {
                // Correct passcode: Hide the form and show the content
                formDiv.style.display = "none";
                contentDiv.style.display = "block";
                errorMsg.style.display = "none";
            } else {
                // Incorrect passcode: Display an error
                errorMsg.style.display = "block";
                document.getElementById("passcode-input").value = ""; // Clear the input field
            }
        }
    </script>

</body>
</html>
