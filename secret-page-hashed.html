<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashed Passcode Protected Content</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        #content-area { display: none; padding: 20px; border: 2px solid #ccc; margin: 20px auto; max-width: 600px; background-color: #f9f9f9; }
        #passcode-form { padding: 20px; border: 1px solid #ddd; display: block; margin: 20px auto; max-width: 400px; background-color: #fff; }
        input[type="password"], button { padding: 10px; margin: 5px; width: 80%; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        #error-message { color: red; display: none; }
    </style>
</head>
<body>

    <div id="passcode-form">
        <h2>Enter Passcode to View (Hashed Check)</h2>
        <input type="password" id="passcode-input" placeholder="Enter Passcode">
        <button onclick="checkPasscode()">Unlock Content</button>
        <p id="error-message">Incorrect Passcode. Try again.</p>
    </div>

    <div id="content-area">
        <h1>Welcome to the Secret Page Maneesha!</h1>
        <p>This content was unlocked after a successful hash comparison.</p>
        <p>Your original password is NOT stored here, only its hash.</p>
        
        </div>

    <script>
        // --- 1. SET THE TARGET HASH HERE ---
        // This is the SHA-256 hash of the password "secret123"
        const TARGET_HASH = "e14c2f2d5fa9c793dbe25b40e1b3df3b1b7ed8eb09308933a7e2c4fc56f13ab7"; 
        // ----------------------------------
        
        // Asynchronous function to generate SHA-256 hash
        async function sha256(message) {
            // Encode the string as utf-8
            const msgBuffer = new TextEncoder().encode(message);                    
            
            // Hash the message
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            
            // Convert buffer to byte array
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            
            // Convert bytes to hex string
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function checkPasscode() {
            const enteredPasscode = document.getElementById("passcode-input").value;
            const contentDiv = document.getElementById("content-area");
            const formDiv = document.getElementById("passcode-form");
            const errorMsg = document.getElementById("error-message");
            
            // Show loading or clear previous error
            errorMsg.style.display = "none";

            // Hash the user's input
            const enteredHash = await sha256(enteredPasscode);

            // Compare the generated hash with the target hash
            if (enteredHash === TARGET_HASH) {
                // Correct hash: Hide the form and show the content
                formDiv.style.display = "none";
                contentDiv.style.display = "block";
            } else {
                // Incorrect hash
                errorMsg.style.display = "block";
                document.getElementById("passcode-input").value = ""; // Clear the input field
            }
        }
    </script>
</body>
</html>
